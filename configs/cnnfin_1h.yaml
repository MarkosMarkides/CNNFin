experiment_name: cnnfin_1h
artifact_dir: artifacts/cnnfin_1h

target_symbol: BTCUSDT
alt_symbols:
  - ADAUSDT
  - BNBUSDT
  - ETHUSDT
  - LINKUSDT
  - LTCUSDT
  - SOLUSDT
  - TRXUSDT
  - XLMUSDT
  - XRPUSDT

interval: 1h
interval_minutes: 60
start_date: "2021-01-01T00:00:00Z"
end_date: "2026-01-01T00:00:00Z"

lookback: 96
horizon: 12
atr_window: 14
class_names:
  0: down
  1: neutral
  2: up

train_years: [2021, 2022, 2023]
val_years: [2024]
test_years: [2025]

lag_periods: [1, 3, 6, 12, 24, 48, 96]
rolling_windows: [12, 24, 48, 96]
image_indicators:
  - return_1
  - return_10
  - RSI_14
  - ATR_14
  - CCI_20
  - MACD26_12
  - SIGNAL26_12
  - HIST26_12
  - VWAP_14
  - Volatility_12
  - "%K_14"
  - "%D_14"
  - OBV

models:
  - logistic_regression
  - random_forest
  - xgboost
  - mlp
  - numeric_lstm
  - efficientnet_b0

seeds: [42]
bootstrap_iterations: 1000

image_lookback: 30
image_size_each: 224
cnn_input_size: 224
batch_size: 64
num_epochs: 20
early_stopping_patience: 5
learning_rate: 0.0001
freeze_cnn_backbone: true
num_workers: 0
